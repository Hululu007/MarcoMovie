<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marco Movie · 三端统一离线发码器 (Ed25519)</title>
<style>
:root{--bg:#0a0b0e;--card:#15171e;--sub:#20232d;--fg:#f3f5f9;--muted:#949ba8;--accent:#007aff;--ok:#10b981;--warn:#f59e0b;--danger:#ff453a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:max(16px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--fg);line-height:1.45}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:.2px}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,122,255,.18);color:#58a6ff;white-space:nowrap}
.badge.ok{background:rgba(16,185,129,.18);color:#34d399}
.badge.warn{background:rgba(245,158,11,.2);color:#fbbf24}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.warn-box{background:rgba(255,69,58,.14);border:1px solid rgba(255,69,58,.35);color:#fca5a5;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:10px}
.info-box{background:rgba(0,122,255,.12);border:1px solid rgba(0,122,255,.28);color:#93c5fd;border-radius:12px;padding:9px 12px;font-size:12px;margin-top:8px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
input,textarea{width:100%;background:var(--sub);color:var(--fg);border:none;border-radius:12px;padding:11px 12px;font-size:14px;outline:none}
input:disabled{opacity:.45;cursor:not-allowed}
textarea{resize:vertical;min-height:74px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pill{padding:7px 12px;border-radius:999px;background:var(--sub);color:var(--muted);font-size:12.5px;font-weight:600;border:none;cursor:pointer}
.pill.on{background:rgba(0,122,255,.22);color:#60a5fa}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--sub);color:var(--fg)}
.btn.sm{width:auto;padding:7px 12px;font-size:12px;border-radius:10px}
.code-box{background:#0e1016;border-radius:12px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;white-space:pre-wrap;margin:8px 0;color:#d8e7ff}
.item{background:var(--sub);border-radius:12px;padding:11px 12px;margin-top:8px}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.item-meta{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-word}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:13.5px}
input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Marco 离线发码器</h1>
    <span id="lockBadge" class="badge">未解锁</span>
  </header>

  <section id="vaultCard" class="card">
    <h2>Ed25519 签名密钥库 <button id="lockBtn" type="button" class="btn sm sec hidden" onclick="lockVault()">锁定</button></h2>
    <p id="vaultHint" class="hint">纯离线运行（零联网）。签发 MMAILAB1 统一口令：Android 移动端 · iOS · Windows 三端共用同一把 Ed25519 密钥。</p>

    <div id="unlockPane">
      <label class="lbl">输入主密码解锁</label>
      <div class="row">
        <input id="unlockPwd" type="password" autocomplete="current-password" placeholder="输入主密码">
        <button type="button" class="btn" style="flex:0 0 96px" onclick="unlockStoredVault()">解锁</button>
      </div>
    </div>

    <div id="importPane" style="margin-top:12px">
      <label class="lbl">首次导入密钥（支持 ai_lab_mobile_vault.json 或原始 64 位 hex 私钥 ai-lab-ed25519.key）</label>
      <input id="vaultFile" type="file" accept=".json,.key,.txt,application/json,text/plain" onchange="handleImportFile(event)">
      <div id="rawPwdBox" class="hidden" style="margin-top:8px">
        <label class="lbl">为导入的 Ed25519 私钥设置本机加密主密码（至少 6 位）</label>
        <div class="row">
          <input id="newVaultPwd" type="password" placeholder="设置主密码">
          <button type="button" class="btn" style="flex:0 0 98px" onclick="finishRawImport()">加密保存</button>
          <button type="button" class="btn sec" style="flex:0 0 68px" onclick="cancelRawImport()">取消</button>
        </div>
      </div>
    </div>
  </section>

  <section id="issueCard" class="card hidden">
    <h2>签发统一内测口令 (MMAILAB1)</h2>
    <div id="testKeyWarn" class="warn-box hidden">
      <div id="testKeyWarnText"></div>
      <div class="sw" style="padding:6px 0 0">
        <span>允许使用非正式测试密钥签发（正式版客户端将拒绝激活）</span>
        <input id="allowTestKeyChk" type="checkbox">
      </div>
    </div>

    <label class="lbl">适用平台（多选单端时将拆为各端独立定向码，不自动扩大为 all）</label>
    <div class="pills" id="platPills">
      <button type="button" class="pill on" data-p="all" onclick="pickPlat('all')">三端通用 (all)</button>
      <button type="button" class="pill" data-p="android" onclick="pickPlat('android')">Android</button>
      <button type="button" class="pill" data-p="ios" onclick="pickPlat('ios')">iOS</button>
      <button type="button" class="pill" data-p="windows" onclick="pickPlat('windows')">Windows</button>
    </div>
    <div id="platModeNotice" class="info-box hidden"></div>

    <label class="lbl">有效期（需明确选择天数或勾选永久有效，空白或负数将被拒绝）</label>
    <div class="pills" id="daysPills">
      <button type="button" class="pill" data-d="7" onclick="setDaysPreset(7,this)">7 天</button>
      <button type="button" class="pill on" data-d="30" onclick="setDaysPreset(30,this)">30 天</button>
      <button type="button" class="pill" data-d="90" onclick="setDaysPreset(90,this)">90 天</button>
      <button type="button" class="pill" data-d="never" onclick="setNeverExpirePreset(this)">永久有效</button>
    </div>
    <div class="sw" style="padding:6px 0 2px">
      <span>永久有效（显式关闭过期限制）</span>
      <input id="neverExpireChk" type="checkbox" onchange="onNeverExpireToggle()">
    </div>

    <div class="row" style="margin-top:4px">
      <div>
        <label class="lbl">标签 / 批次 Tag</label>
        <input id="tagIn" type="text" maxlength="48" value="channel-01" placeholder="如：channel-01">
      </div>
      <div>
        <label class="lbl">有效天数（1-3650）</label>
        <input id="daysIn" type="number" min="1" max="3650" step="1" value="30">
      </div>
      <div>
        <label class="lbl">每端数量（1-50）</label>
        <input id="countIn" type="number" min="1" max="50" step="1" value="1">
      </div>
    </div>

    <div class="row" style="margin-top:4px">
      <div>
        <label class="lbl" id="minVcLbl">最低版本码（仅单选 Android 可设）</label>
        <input id="minVcIn" type="number" min="0" max="65535" step="1" value="0" disabled>
      </div>
      <div>
        <label class="lbl">发放备注（仅存本机台账）</label>
        <input id="noteIn" type="text" maxlength="80" placeholder="如：腾讯频道第一批">
      </div>
    </div>

    <div class="sw">
      <span>频道通用口令（多人共用体验）</span>
      <input id="sharedChk" type="checkbox" checked>
    </div>

    <button type="button" class="btn" style="margin-top:8px" onclick="issueNow()">立即离线签发口令</button>

    <div id="resultWrap" class="hidden" style="margin-top:12px">
      <div id="resultMeta" class="hint"></div>
      <div id="resultCodes" class="code-box"></div>
      <div class="row">
        <button type="button" class="btn" onclick="copyLastCodes(false)">一键复制口令</button>
        <button type="button" class="btn sec" onclick="copyLastCodes(true)">复制带频道说明文案</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>离线验签与各端激活检查</h2>
    <textarea id="verifyIn" placeholder="粘贴 MMAILAB1.… 口令（支持 Android/发码器折行提取；注意 Windows 0.7.3 正式版需保持整条口令单行无换行）"></textarea>
    <label class="lbl">目标 Android 版本码 versionCode（可选；含 min_vc 限制的口令须填写后才可判定是否可激活）</label>
    <input id="verifyAndroidVcIn" type="number" min="0" max="65535" step="1" placeholder="留空表示未指定目标版本码，例如 103">
    <button type="button" class="btn sec" style="margin-top:8px" onclick="verifyInputCode()">立即离线验证</button>
    <div id="verifyOut" class="code-box hidden"></div>
  </section>

  <section id="ledgerCard" class="card hidden">
    <h2>
      <span>本机审计台账</span>
      <span style="display:flex;gap:6px">
        <button type="button" class="btn sm sec" onclick="exportLedger()">导出元数据</button>
        <button type="button" class="btn sm sec" onclick="clearLedger()">清空</button>
      </span>
    </h2>
    <p class="hint">安全可见范围：本机台账仅保存时间、标签、平台、脱敏摘要（不含完整可用口令），锁定时立即隐藏并清空内存中刚生成的口令；导出文件同样仅含审计元数据。</p>
    <div id="ledgerList"></div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
// Pure-JS BigInt RFC 8032 Ed25519 + SHA-512 + SHA-256 + PBKDF2-HMAC-SHA256 Encrypted Vault
// 100% offline compatible with file://, content://, iOS Safari, Android Chrome, and Node.js!
const MarcoEd25519 = (() => {
  const TOKEN_PREFIX = "MMAILAB1.";
  const SIGN_DOMAIN = new TextEncoder().encode("marco-ai-lab-v1:");
  const DEFAULT_PUB_HEX = "1dbeaed851b873d7c327d30d718fca0ac1509ef5ac4061b9bd1aa90c841c6929";
  const SINGLE_PLATFORMS = ["android", "ios", "windows"];
  const VALID_TOKEN_PLATFORMS = ["all", "android", "ios", "windows"];
  const ED25519_SIG_B64URL_LEN = 86;
  const MAX_DAYS = 3650;
  const MAX_COUNT = 50;
  const MAX_MIN_VC = 65535;
  const MAX_TAG_LEN = 48;

  // --- SHA-256 (for PBKDF2, encrypted local vault, and ledger fingerprints) ---
  const K256 = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);
  function sha256(bytes) {
    const len = bytes.length, bitLen = len * 8;
    const total = Math.ceil((len + 9) / 64) * 64;
    const buf = new Uint8Array(total);
    buf.set(bytes); buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 8, Math.floor(bitLen / 0x100000000), false);
    dv.setUint32(total - 4, bitLen >>> 0, false);
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    const w = new Uint32Array(64);
    for (let off = 0; off < total; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
      for (let i = 16; i < 64; i++) {
        const s0 = ((w[i-15]>>>7)|(w[i-15]<<25)) ^ ((w[i-15]>>>18)|(w[i-15]<<14)) ^ (w[i-15]>>>3);
        const s1 = ((w[i-2]>>>17)|(w[i-2]<<15)) ^ ((w[i-2]>>>19)|(w[i-2]<<13)) ^ (w[i-2]>>>10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for (let i = 0; i < 64; i++) {
        const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
        const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0;
      h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+h)>>>0;
    }
    const out = new Uint8Array(32), odv = new DataView(out.buffer);
    [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v,i)=>odv.setUint32(i*4,v,false));
    return out;
  }

  // --- SHA-512 (for RFC 8032 Ed25519) ---
  const M64 = (1n << 64n) - 1n;
  const K512 = [
    0x428a2f98d728ae22n,0x7137449123ef65cdn,0xb5c0fbcfec4d3b2fn,0xe9b5dba58189dbbcn,
    0x3956c25bf348b538n,0x59f111f1b605d019n,0x923f82a4af194f9bn,0xab1c5ed5da6d8118n,
    0xd807aa98a3030242n,0x12835b0145706fben,0x243185be4ee4b28cn,0x550c7dc3d5ffb4e2n,
    0x72be5d74f27b896fn,0x80deb1fe3b1696b1n,0x9bdc06a725c71235n,0xc19bf174cf692694n,
    0xe49b69c19ef14ad2n,0xefbe4786384f25e3n,0x0fc19dc68b8cd5b5n,0x240ca1cc77ac9c65n,
    0x2de92c6f592b0275n,0x4a7484aa6ea6e483n,0x5cb0a9dcbd41fbd4n,0x76f988da831153b5n,
    0x983e5152ee66dfabn,0xa831c66d2db43210n,0xb00327c898fb213fn,0xbf597fc7beef0ee4n,
    0xc6e00bf33da88fc2n,0xd5a79147930aa725n,0x06ca6351e003826fn,0x142929670a0e6e70n,
    0x27b70a8546d22ffcn,0x2e1b21385c26c926n,0x4d2c6dfc5ac42aedn,0x53380d139d95b3dfn,
    0x650a73548baf63den,0x766a0abb3c77b2a8n,0x81c2c92e47edaee6n,0x92722c851482353bn,
    0xa2bfe8a14cf10364n,0xa81a664bbc423001n,0xc24b8b70d0f89791n,0xc76c51a30654be30n,
    0xd192e819d6ef5218n,0xd69906245565a910n,0xf40e35855771202an,0x106aa07032bbd1b8n,
    0x19a4c116b8d2d0c8n,0x1e376c085141ab53n,0x2748774cdf8eeb99n,0x34b0bcb5e19b48a8n,
    0x391c0cb3c5c95a63n,0x4ed8aa4ae3418acbn,0x5b9cca4f7763e373n,0x682e6ff3d6b2b8a3n,
    0x748f82ee5defb2fcn,0x78a5636f43172f60n,0x84c87814a1f0ab72n,0x8cc702081a6439ecn,
    0x90befffa23631e28n,0xa4506cebde82bde9n,0xbef9a3f7b2c67915n,0xc67178f2e372532bn,
    0xca273eceea26619cn,0xd186b8c721c0c207n,0xeada7dd6cde0eb1en,0xf57d4f7fee6ed178n,
    0x06f067aa72176fban,0x0a637dc5a2c898a6n,0x113f9804bef90daen,0x1b710b35131c471bn,
    0x28db77f523047d84n,0x32caab7b40c72493n,0x3c9ebe0a15c9bebcn,0x431d67c49c100d4cn,
    0x4cc5d4becb3e42b6n,0x597f299cfc657e2an,0x5fcb6fab3ad6faecn,0x6c44198c4a475817n
  ];
  const rotr64 = (x, n) => ((x >> n) | ((x << (64n - n)) & M64)) & M64;
  function sha512(bytes) {
    const len = bytes.length, bitLen = BigInt(len) * 8n;
    const total = Math.ceil((len + 17) / 128) * 128;
    const buf = new Uint8Array(total);
    buf.set(bytes); buf[len] = 0x80;
    let tmp = bitLen;
    for (let i = 0; i < 16; i++) { buf[total - 1 - i] = Number(tmp & 0xffn); tmp >>= 8n; }
    let H = [
      0x6a09e667f3bcc908n,0xbb67ae8584caa73bn,0x3c6ef372fe94f82bn,0xa54ff53a5f1d36f1n,
      0x510e527fade682d1n,0x9b05688c2b3e6c1fn,0x1f83d9abfb41bd6bn,0x5be0cd19137e2179n
    ];
    const W = new Array(80);
    for (let off = 0; off < total; off += 128) {
      for (let i = 0; i < 16; i++) {
        let v = 0n;
        for (let j = 0; j < 8; j++) v = (v << 8n) | BigInt(buf[off + i*8 + j]);
        W[i] = v;
      }
      for (let i = 16; i < 80; i++) {
        const s0 = rotr64(W[i-15], 1n) ^ rotr64(W[i-15], 8n) ^ (W[i-15] >> 7n);
        const s1 = rotr64(W[i-2], 19n) ^ rotr64(W[i-2], 61n) ^ (W[i-2] >> 6n);
        W[i] = (W[i-16] + s0 + W[i-7] + s1) & M64;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let i = 0; i < 80; i++) {
        const S1 = rotr64(e, 14n) ^ rotr64(e, 18n) ^ rotr64(e, 41n);
        const ch = (e & f) ^ ((~e & M64) & g);
        const t1 = (h + S1 + ch + K512[i] + W[i]) & M64;
        const S0 = rotr64(a, 28n) ^ rotr64(a, 34n) ^ rotr64(a, 39n);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) & M64;
        h=g; g=f; f=e; e=(d+t1)&M64; d=c; c=b; b=a; a=(t1+t2)&M64;
      }
      H = [(H[0]+a)&M64,(H[1]+b)&M64,(H[2]+c)&M64,(H[3]+d)&M64,(H[4]+e)&M64,(H[5]+f)&M64,(H[6]+g)&M64,(H[7]+h)&M64];
    }
    const out = new Uint8Array(64);

      officialPublicKey: isOfficialPublicKey(pubHex),
      expired,
      expireDate,
      activatable,
      claims,
      canonical
    };
    if (opts && opts.targetPlatform) {
      const tp = normalizeSinglePlatform(opts.targetPlatform);
      const ev = activatable[tp] || { ok: false, reason: "未知目标平台" };
      out.targetPlatform = tp;
      out.activatableForTarget = ev.ok;
      out.targetReason = ev.reason;
    }
    return out;
  }

  return {
    DEFAULT_PUB_HEX, SINGLE_PLATFORMS, VALID_TOKEN_PLATFORMS,
    hexToBytes, bytesToHex, publicKeyFromSeed, isOfficialPublicKey,
    extractToken, planTargetPlatforms, validateIssuanceInput, tokenFingerprint,
    encryptVault, decryptVault, encodePasscode, issueBatch, verifyPasscode
  };
})();

// --- Mobile UI Controller (DOM-safe: zero innerHTML, metadata-only audit ledger) ---
const PRELOADED_VAULT = /*__PRELOADED_ENCRYPTED_VAULT__*/null;

function toast(msg) {

function getStoredVault() {

function initUi() {
  if (typeof document === "undefined") return;

    activePubHex = v.pub_hex || MarcoEd25519.DEFAULT_PUB_HEX;
    document.getElementById("vaultHint").textContent =
      MarcoEd25519.isOfficialPublicKey(activePubHex)
        ? "已载入官方加密 Ed25519 密钥库，输入主密码解锁即可离线签发三端统一 MMAILAB1 口令。"
        : "已载入非正式测试密钥库（公钥与官方钉住公钥不匹配），仅可用于本地测试。";

function unlockStoredVault() {

  const pwd = document.getElementById("unlockPwd").value;
  if (!pwd) return toast("请输入主密码");
  try {
    const res = MarcoEd25519.decryptVault(v, pwd);
    activeSeed = res.seed;
    activePubHex = MarcoEd25519.bytesToHex(res.pub);
    document.getElementById("unlockPwd").value = "";
    syncUnlockedUi(true);
    toast(MarcoEd25519.isOfficialPublicKey(activePubHex)
      ? "官方 Ed25519 密钥库已解锁"
      : "已解锁（警告：非正式公钥，正式版客户端将拒绝激活）");
  } catch (e) { toast(e.message || "解锁失败"); }
}
function clearFileInput() {
  const vf = document.getElementById("vaultFile");

    vf.value = "";
    if (vf.files && vf.files.length > 0 && typeof DataTransfer !== "undefined") {

function invalidateActiveFileReader() {

  if (r && typeof r.abort === "function") {

  }

function scrubPendingImport() {

  if (pendingRawSeed && pendingRawSeed.fill) pendingRawSeed.fill(0);
  pendingRawSeed = null;
  const np = document.getElementById("newVaultPwd");
  const rb = document.getElementById("rawPwdBox");

  if (rb) rb.classList.add("hidden");

}
function clearVisibleOutputs() {

function lockVault() {
  if (activeSeed && activeSeed.fill) activeSeed.fill(0);
  activeSeed = null;
  scrubPendingImport();
  const up = document.getElementById("unlockPwd");
  if (up) up.value = "";
  clearVisibleOutputs();
  syncUnlockedUi(false);
  toast("已锁定密钥库、清除待处理种子并释放文件选择");
}
function cancelRawImport() {

  clearVisibleOutputs();
  toast("已取消导入并清除待处理私钥");
}
function syncUnlockedUi(on) {
  const b = document.getElementById("lockBadge");
  const official = MarcoEd25519.isOfficialPublicKey(activePubHex);
  b.classList.remove("ok", "warn");
  if (!on) {
    b.textContent = "未解锁";
  } else if (official) {
    b.textContent = "已解锁 · 官方公钥就绪";
    b.classList.add("ok");
  } else {
    b.textContent = "非正式密钥 · 仅测试";
    b.classList.add("warn");
  }
  document.getElementById("lockBtn").classList.toggle("hidden", !on);
  document.getElementById("unlockPane").classList.toggle("hidden", on || !getStoredVault());
  document.getElementById("importPane").classList.toggle("hidden", on);
  document.getElementById("issueCard").classList.toggle("hidden", !on);
  document.getElementById("ledgerCard").classList.toggle("hidden", !on);

  const warnBox = document.getElementById("testKeyWarn");
  const warnTxt = document.getElementById("testKeyWarnText");
  const allowChk = document.getElementById("allowTestKeyChk");
  if (on && !official) {
    warnTxt.textContent =
      `警告：当前解锁密钥的公钥 (${activePubHex.slice(0, 12)}…) 与官方钉住公钥 (${MarcoEd25519.DEFAULT_PUB_HEX.slice(0, 12)}…) 不一致，正式签发已锁定。`;
    warnBox.classList.remove("hidden");
  } else {
    warnBox.classList.add("hidden");
    if (allowChk) allowChk.checked = false;

function handleImportFile(ev) {
  const f = ev && ev.target && ev.target.files && ev.target.files[0];
  clearFileInput();
  if (!f) {
    scrubPendingImport();
    return;
  }
  scrubPendingImport();
  const token = ++importSessionId;
  const reader = new FileReader();
  activeFileReader = reader;
  reader.onerror = () => {
    if (token !== importSessionId) return;
    if (activeFileReader === reader) activeFileReader = null;
    scrubPendingImport();
    clearVisibleOutputs();
    toast("读取密钥文件失败，已清除待处理状态");
  };
  reader.onabort = () => {
    if (token !== importSessionId) return;
    if (activeFileReader === reader) activeFileReader = null;
    scrubPendingImport();
    clearVisibleOutputs();
  };
  reader.onload = () => {
    if (token !== importSessionId) return;
    if (activeFileReader === reader) activeFileReader = null;
    clearFileInput();
    const text = String(reader.result || "").trim();
    try {
      const obj = JSON.parse(text);
      if (obj.format === "marco-ai-ed25519-vault-v1") {
        scrubPendingImport();
        localStorage.setItem(LS_VAULT, JSON.stringify(obj));
        activePubHex = obj.pub_hex || MarcoEd25519.DEFAULT_PUB_HEX;
        document.getElementById("unlockPane").classList.remove("hidden");
        return toast(MarcoEd25519.isOfficialPublicKey(activePubHex)
          ? "已导入官方加密密钥库，请输入主密码解锁"
          : "已导入密钥库（注意：非官方钉住公钥），请输入主密码解锁");
      }
    } catch (_) {}
    const hex = text.split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith("#")).join("").trim();
    if (/^[0-9a-fA-F]{64}$/.test(hex)) {
      if (pendingRawSeed && pendingRawSeed.fill) pendingRawSeed.fill(0);
      pendingRawSeed = MarcoEd25519.hexToBytes(hex);
      document.getElementById("rawPwdBox").classList.remove("hidden");
      return toast("已读取 32 字节 Ed25519 私钥并释放文件句柄，请设置本机加密主密码");
    }
    scrubPendingImport();
    clearVisibleOutputs();
    toast("无法识别的密钥文件格式，已清除待处理状态");
  };
  reader.readAsText(f);
}
function finishRawImport() {
  if (!pendingRawSeed) return;
  const pwd = document.getElementById("newVaultPwd").value;
  if (!pwd || pwd.length < 6) return toast("主密码至少 6 位");
  try {
    const pub = MarcoEd25519.publicKeyFromSeed(pendingRawSeed);
    const vault = MarcoEd25519.encryptVault(pendingRawSeed, pub, pwd);
    localStorage.setItem(LS_VAULT, JSON.stringify(vault));
    if (activeSeed && activeSeed.fill) activeSeed.fill(0);
    activeSeed = pendingRawSeed.slice();
    activePubHex = MarcoEd25519.bytesToHex(pub);
    scrubPendingImport();
    syncUnlockedUi(true);
    toast(MarcoEd25519.isOfficialPublicKey(activePubHex)
      ? "官方私钥已加密存入本机并解锁"
      : "测试私钥已加密存入本机（非正式公钥）");
  } catch (e) {
    scrubPendingImport();
    clearVisibleOutputs();
    toast(e.message || "加密保存失败");
  }
}
function pickPlat(p) {
  if (p === "all") {
    selectedPlats = new Set(["all"]);
  } else {
    selectedPlats.delete("all");
    if (selectedPlats.has(p)) selectedPlats.delete(p); else selectedPlats.add(p);
    if (selectedPlats.size === 0) selectedPlats = new Set(["all"]);
  }
  syncPlatformControls();
}
function syncPlatformControls() {
  document.querySelectorAll("#platPills .pill").forEach(b => b.classList.toggle("on", selectedPlats.has(b.dataset.p)));
  const targets = Array.from(selectedPlats);
  const androidOnly = targets.length === 1 && targets[0] === "android";
  const minVcIn = document.getElementById("minVcIn");
  const minVcLbl = document.getElementById("minVcLbl");
  const notice = document.getElementById("platModeNotice");
  if (minVcIn) {
    minVcIn.disabled = !androidOnly;
    if (!androidOnly) minVcIn.value = "0";
  }
  if (minVcLbl) {
    minVcLbl.textContent = androidOnly
      ? "最低版本码（仅 Android 生效，0=不限）"
      : "最低版本码（仅单选 Android 可设）";
  }
  if (notice) {
    if (targets.length > 1) {
      notice.textContent = `已多选 ${targets.join(" / ")}：为兼容 Windows 正式版（仅接受单端或 all），将自动拆分为各端独立定向口令，绝不自动扩大为 all。`;
      notice.classList.remove("hidden");
    } else {
      notice.textContent = "";
      notice.classList.add("hidden");
    }
  }
}
function setDaysPreset(d, btn) {

  const daysIn = document.getElementById("daysIn");
  daysIn.disabled = false;
  daysIn.value = String(d);
  document.querySelectorAll("#daysPills .pill").forEach(b => b.classList.toggle("on", b === btn));

function setNeverExpirePreset(btn) {

  document.querySelectorAll("#daysPills .pill").forEach(b => b.classList.toggle("on", b === btn));

function onNeverExpireToggle() {

function issueNow() {
  if (!activeSeed) return toast("请先解锁密钥库");
  const official = MarcoEd25519.isOfficialPublicKey(activePubHex);
  if (!official && !document.getElementById("allowTestKeyChk").checked) {
    return toast("当前非官方公钥，请先勾选允许测试密钥签发，或导入官方密钥");
  }
  const tag = document.getElementById("tagIn").value;
  const neverExpire = document.getElementById("neverExpireChk").checked;
  const daysRaw = document.getElementById("daysIn").value;
  const countRaw = document.getElementById("countIn").value;
  const minVcRaw = document.getElementById("minVcIn").value;
  const note = (document.getElementById("noteIn").value || "").trim();
  const shared = document.getElementById("sharedChk").checked;
  const expOAuth = false;
  try {
    const batch = MarcoEd25519.issueBatch(activeSeed, activePubHex, {
      tag,
      days: neverExpire ? 0 : daysRaw,
      neverExpire,
      platforms: Array.from(selectedPlats),
      shared,
      expOAuth,
      minVc: minVcRaw,
      count: countRaw
    });
    const multiTarget = batch.targets.length > 1;
    const platZh = multiTarget
      ? ("拆分定向：" + batch.targets.join(" + "))
      : (batch.targets[0] === "all" ? "三端通用 (all)" : ("仅限 " + batch.targets[0]));
    const expireLabel = batch.items[0].expireDate;
    const summary = `${official ? "" : "[测试密钥] "}${tag.trim()} · ${platZh} · ${shared ? "频道通用" : "专属测试"} · 有效至 ${expireLabel}`;
    lastIssued = { items: batch.items, summary, multiTarget };
    document.getElementById("resultMeta").textContent = summary;
    document.getElementById("resultCodes").textContent = batch.items
      .map(it => multiTarget ? `[${it.platform}] ${it.code}` : it.code)
      .join("\n");
    document.getElementById("resultWrap").classList.remove("hidden");

    // Metadata-only audit ledger: NEVER persist full usable passcodes to localStorage!
    const ledger = loadLedger();
    ledger.unshift({
      at: new Date().toLocaleString("zh-CN", { hour12: false }),
      tag: tag.trim(),
      plat: platZh,
      shared,
      expOAuth,
      expireLabel,
      count: batch.items.length,
      note,
      officialKey: official,
      fingerprints: batch.items.map(it => `${it.platform}: ${it.fingerprint}`)
    });
    localStorage.setItem(LS_LEDGER, JSON.stringify(ledger.slice(0, 100)));
    renderLedger();
    toast(`已签发 ${batch.items.length} 枚 MMAILAB1 口令`);
  } catch (e) {
    toast(e.message || "参数校验失败");
  }
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast("已复制到剪贴板")).catch(()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  document.execCommand("copy"); document.body.removeChild(ta); toast("已复制到剪贴板");
}
function copyLastCodes(withCaption) {
  if (!lastIssued.items.length) return;
  const raw = lastIssued.items
    .map(it => lastIssued.multiTarget ? `[${it.platform}] ${it.code}` : it.code)
    .join("\n");
  if (!withCaption) return copyText(raw);
  copyText(`【Marco Movie · AI 观影实验室测试口令】\n${lastIssued.summary}\n复制对应平台口令前往设置「AI 观影实验室」粘贴解锁：\n${raw}`);
}
function verifyInputCode() {
  const vcEl = document.getElementById("verifyAndroidVcIn");
  const vcRaw = vcEl ? String(vcEl.value || "").trim() : "";
  const appVersionCode = vcRaw ? Number(vcRaw) : 0;
  const res = MarcoEd25519.verifyPasscode(document.getElementById("verifyIn").value, activePubHex, {
    appVersionCode: Number.isInteger(appVersionCode) && appVersionCode > 0 ? appVersionCode : 0
  });
  const out = document.getElementById("verifyOut");
  const lines = [];
  lines.push(`Ed25519 签名有效：${res.signatureValid ? "是" : "否"}${res.error ? "（" + res.error + "）" : ""}`);
  if (res.activatable) {
    lines.push(`验签公钥：${res.officialPublicKey ? "官方钉住公钥" : "当前自定义测试公钥"}`);
    lines.push(`有效期至：${res.expireDate}${res.expired ? "（已过期）" : ""}`);
    for (const p of MarcoEd25519.SINGLE_PLATFORMS) {
      const a = res.activatable[p];
      const statusText = a.status === "unknown_version" ? "待核验目标版本" : (a.ok ? "是" : "否");
      lines.push(`- ${p} 端可激活：${statusText}（${a.reason}${a.warning ? "；" + a.warning : ""}）`);
    }
    if (res.claims) lines.push("\n原始载荷：\n" + JSON.stringify(res.claims, null, 2));
  }
  out.textContent = lines.join("\n");
  out.classList.remove("hidden");
  const anyOk = res.activatable && MarcoEd25519.SINGLE_PLATFORMS.some(p => res.activatable[p].ok);
  const anyUnknown = res.activatable && MarcoEd25519.SINGLE_PLATFORMS.some(p => res.activatable[p].status === "unknown_version");
  toast(!res.signatureValid ? "签名校验未通过" : (anyUnknown ? "签名有效，请填写目标 Android 版本码以判定是否可激活" : (anyOk ? "签名有效，请核对上方各端可激活状态" : "签名有效，但当前无端可激活（已过期、版本不足或平台不兼容）")));
}
function loadLedger() {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_LEDGER) || "[]");
    return Array.isArray(arr) ? arr : [];
  } catch (_) { return []; }
}
function renderLedger() {
  const box = document.getElementById("ledgerList");
  if (!box) return;
  box.textContent = "";
  if (!activeSeed) return;
  const list = loadLedger();
  if (!list.length) {
    const empty = document.createElement("p");
    empty.className = "hint";
    empty.textContent = "暂无发码审计记录。";
    box.appendChild(empty);
    return;
  }
  for (const it of list) {
    const card = document.createElement("div");
    card.className = "item";

    const top = document.createElement("div");
    top.className = "item-top";
    const titleSpan = document.createElement("span");
    const label = `${it.officialKey === false ? "[测试] " : ""}${String(it.tag || "")} · ${String(it.note || (it.shared ? "频道通用" : "专属测试"))} (${Number(it.count || 0)}枚)`;
    titleSpan.textContent = label;
    top.appendChild(titleSpan);
    card.appendChild(top);

    const meta = document.createElement("div");
    meta.className = "item-meta";
    meta.textContent = `${String(it.plat || "")} · 有效至 ${String(it.expireLabel || "")} · ${String(it.at || "")}`;
    card.appendChild(meta);

    if (Array.isArray(it.fingerprints) && it.fingerprints.length) {
      const fp = document.createElement("div");
      fp.className = "item-meta";
      fp.textContent = "摘要：" + it.fingerprints.slice(0, 3).join(" | ") + (it.fingerprints.length > 3 ? ` 等共 ${it.fingerprints.length} 条` : "");
      card.appendChild(fp);
    }
    box.appendChild(card);
  }
}
function clearLedger() {
  localStorage.removeItem(LS_LEDGER);
  renderLedger();
  toast("已清空本机审计台账");
}
function exportLedger() {
  if (!activeSeed) return toast("请先解锁密钥库");
  const payload = {
    exported_at: new Date().toISOString(),
    contains_usable_passcodes: false,
    note: "Metadata-only audit log; raw usable passcodes are intentionally never persisted.",
    entries: loadLedger()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "marco-ai-passcode-audit-ledger.json";
  a.click();
}
if (typeof window !== "undefined") window.addEventListener("DOMContentLoaded", initUi);
