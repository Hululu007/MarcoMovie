<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marco Movie · 作者离线发码器</title>
<style>
:root{--bg:#0a0b0e;--card:#15171e;--sub:#20232d;--fg:#f3f5f9;--muted:#949ba8;--accent:#007aff;--ok:#10b981;--warn:#f59e0b;--danger:#ff453a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:max(16px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--fg);line-height:1.45}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:.2px}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,122,255,.18);color:#58a6ff}
.badge.ok{background:rgba(16,185,129,.18);color:#34d399}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
input,textarea{width:100%;background:var(--sub);color:var(--fg);border:none;border-radius:12px;padding:11px 12px;font-size:14px;outline:none}
textarea{resize:vertical;min-height:74px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pill{padding:7px 12px;border-radius:999px;background:var(--sub);color:var(--muted);font-size:12.5px;font-weight:600;border:none;cursor:pointer}
.pill.on{background:rgba(0,122,255,.22);color:#60a5fa}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--sub);color:var(--fg)}
.btn.danger{background:rgba(255,69,58,.18);color:var(--danger)}
.btn.sm{width:auto;padding:7px 12px;font-size:12px;border-radius:10px}
.code-box{background:#0e1016;border-radius:12px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;margin:8px 0;color:#d8e7ff}
.item{background:var(--sub);border-radius:12px;padding:11px 12px;margin-top:8px}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.item-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
.hidden{display:none!important}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Marco 离线发码器</h1>
    <span id="lockBadge" class="badge">未解锁</span>
  </header>

  <section id="vaultCard" class="card">
    <h2>作者签名密钥库 <button id="lockBtn" class="btn sm sec hidden" onclick="lockVault()">锁定</button></h2>
    <p id="vaultHint" class="hint">纯离线运行（零联网、零外泄）。三端统一口令：Android 移动端 · iOS · Windows 通用同一把 P-256 密钥。</p>

    <div id="unlockPane">
      <label class="lbl">输入主密码解锁</label>
      <div class="row">
        <input id="unlockPwd" type="password" autocomplete="current-password" placeholder="输入主密码">
        <button class="btn" style="flex:0 0 96px" onclick="unlockStoredVault()">解锁</button>
      </div>
    </div>

    <div id="importPane" style="margin-top:12px">
      <label class="lbl">首次导入密钥（支持电脑端导出的 ai_beta_mobile_vault.json 或 ai_beta_signing.key）</label>
      <input id="vaultFile" type="file" accept=".json,.key,application/json,text/plain" onchange="handleImportFile(event)">
      <div id="rawPwdBox" class="hidden" style="margin-top:8px">
        <label class="lbl">为导入的原始私钥设置本机加密主密码（至少 6 位）</label>
        <div class="row">
          <input id="newVaultPwd" type="password" placeholder="设置主密码">
          <button class="btn" style="flex:0 0 108px" onclick="finishRawImport()">加密保存</button>
        </div>
      </div>
    </div>
  </section>

  <section id="issueCard" class="card hidden">
    <h2>签发统一内测口令</h2>
    <label class="lbl">适用平台（全选或留空 = 三端通用）</label>
    <div class="pills" id="platPills">
      <button type="button" class="pill on" data-p="all" onclick="pickPlat('all')">三端通用</button>
      <button type="button" class="pill" data-p="android" onclick="pickPlat('android')">Android</button>
      <button type="button" class="pill" data-p="ios" onclick="pickPlat('ios')">iOS</button>
      <button type="button" class="pill" data-p="windows" onclick="pickPlat('windows')">Windows</button>
    </div>

    <label class="lbl">有效期</label>
    <div class="pills" id="daysPills">
      <button type="button" class="pill" onclick="setDays(7,this)">7 天</button>
      <button type="button" class="pill on" onclick="setDays(30,this)">30 天</button>
      <button type="button" class="pill" onclick="setDays(90,this)">90 天</button>
      <button type="button" class="pill" onclick="setDays(0,this)">永久有效</button>
    </div>

    <div class="row" style="margin-top:8px">
      <div>
        <label class="lbl">批次号 Batch</label>
        <input id="batchIn" type="number" min="1" max="65535" value="1">
      </div>
      <div>
        <label class="lbl">有效天数（0=永久）</label>
        <input id="daysIn" type="number" min="0" max="60000" value="30">
      </div>
      <div>
        <label class="lbl">生成数量</label>
        <input id="countIn" type="number" min="1" max="50" value="1">
      </div>
    </div>

    <div class="row" style="margin-top:4px">
      <div>
        <label class="lbl">最低版本码（三端通用填 0）</label>
        <input id="minVcIn" type="number" min="0" max="65535" value="0">
      </div>
      <div>
        <label class="lbl">发放备注（仅记录在本机台账）</label>
        <input id="noteIn" type="text" placeholder="如：腾讯频道第 1 批">
      </div>
    </div>

    <div class="sw">
      <span>频道通用口令（多人共用体验）</span>
      <input id="sharedChk" type="checkbox" checked>
    </div>
    <div class="sw">
      <span>开放实验性 OpenAI OAuth 权限</span>
      <input id="expChk" type="checkbox">
    </div>

    <button class="btn" style="margin-top:8px" onclick="issueNow()">立即离线签发口令</button>

    <div id="resultWrap" class="hidden" style="margin-top:12px">
      <div id="resultMeta" class="hint"></div>
      <div id="resultCodes" class="code-box"></div>
      <div class="row">
        <button class="btn" onclick="copyLastCodes(false)">一键复制口令</button>
        <button class="btn sec" onclick="copyLastCodes(true)">复制带频道说明文案</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>离线验签与口令解析</h2>
    <textarea id="verifyIn" placeholder="粘贴 MM-AI1-... 口令离线检验真伪、平台、批次与有效期"></textarea>
    <button class="btn sec" style="margin-top:8px" onclick="verifyInputCode()">立即离线验证</button>
    <div id="verifyOut" class="code-box hidden"></div>
  </section>

  <section id="ledgerCard" class="card hidden">
    <h2>本机发码台账 <button class="btn sm sec" onclick="exportLedger()">导出备份</button></h2>
    <div id="ledgerList"></div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
// Pure-JS BigInt NIST P-256 ECDSA + RFC 6979 + SHA-256 + PBKDF2-HMAC-SHA256 Vault
// Works 100% offline in file://, content://, iOS Safari, Android Chrome, and Node.js!
const MarcoCrypto = (() => {
  const P = 0xffffffff00000001000000000000000000000000ffffffffffffffffffffffffn;
  const A = P - 3n;
  const B = 0x5ac635d8aa3a93e7b3ebbd55769886bc651d06b0cc53b0f63bce3c3e27d2604bn;
  const N = 0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551n;
  const GX = 0x6b17d1f2e12c4247f8bce6e563a440f277037d812deb33a0f4a13945d898c296n;
  const GY = 0x4fe342e2fe1a7f9b8ee7eb4a7c0f9e162bce33576b315ececbb6406837bf51f5n;
  const G = [GX, GY];
  const DOMAIN_SEP = new TextEncoder().encode("MARCO-AI-BETA-V1:");
  const TOKEN_PREFIX = "MM-AI1-";
  const DEFAULT_PUB_HEX = "0456317d317a40913428b964ef557207cac459d89c37a2c9377c84caa5e94a7a8fb0c80cb3ac36b149d50de0c6a5324cca2afe33c95224a52ddb05e541d176eaf1";
  const EPOCH_2026_UTC_MS = Date.UTC(2026, 0, 1);

  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);

  function sha256(bytes) {
    const len = bytes.length;
    const bitLen = len * 8;
    const total = Math.ceil((len + 9) / 64) * 64;
    const buf = new Uint8Array(total);
    buf.set(bytes);
    buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 8, Math.floor(bitLen / 0x100000000), false);
    dv.setUint32(total - 4, bitLen >>> 0, false);
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    const w = new Uint32Array(64);
    for (let off = 0; off < total; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
      for (let i = 16; i < 64; i++) {
        const s0 = ((w[i-15]>>>7)|(w[i-15]<<25)) ^ ((w[i-15]>>>18)|(w[i-15]<<14)) ^ (w[i-15]>>>3);
        const s1 = ((w[i-2]>>>17)|(w[i-2]<<15)) ^ ((w[i-2]>>>19)|(w[i-2]<<13)) ^ (w[i-2]>>>10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for (let i = 0; i < 64; i++) {
        const S1 = ((e>>>6)|(e<<26)) ^ ((e>>>11)|(e<<21)) ^ ((e>>>25)|(e<<7));
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
        const S0 = ((a>>>2)|(a<<30)) ^ ((a>>>13)|(a<<19)) ^ ((a>>>22)|(a<<10));
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0;
      h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+h)>>>0;
    }
    const out = new Uint8Array(32);
    const odv = new DataView(out.buffer);
    [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v,i)=>odv.setUint32(i*4,v,false));
    return out;
  }

  function concat(...arrs) {
    const n = arrs.reduce((s,a)=>s+a.length, 0);
    const out = new Uint8Array(n);
    let o = 0;
    for (const a of arrs) { out.set(a, o); o += a.length; }
    return out;
  }

  function hmacSha256(key, msg) {
    const k = key.length > 64 ? sha256(key) : key;
    const ipad = new Uint8Array(64), opad = new Uint8Array(64);
    for (let i = 0; i < 64; i++) {
      const kb = i < k.length ? k[i] : 0;
      ipad[i] = kb ^ 0x36; opad[i] = kb ^ 0x5c;
    }
    return sha256(concat(opad, sha256(concat(ipad, msg))));
  }

  function pbkdf2Sha256(pwdBytes, salt, iters, dkLen) {
    const blocks = Math.ceil(dkLen / 32);
    const out = new Uint8Array(blocks * 32);
    for (let b = 1; b <= blocks; b++) {
      const be = new Uint8Array(4);
      new DataView(be.buffer).setUint32(0, b, false);
      let u = hmacSha256(pwdBytes, concat(salt, be));
      const t = new Uint8Array(u);
      for (let i = 1; i < iters; i++) {
        u = hmacSha256(pwdBytes, u);
        for (let j = 0; j < 32; j++) t[j] ^= u[j];
      }
      out.set(t, (b - 1) * 32);
    }
    return out.slice(0, dkLen);
  }

  const mod = (a, m) => ((a % m) + m) % m;
  function modInv(a, m) {
    let t = 0n, newT = 1n, r = m, newR = mod(a, m);
    while (newR !== 0n) {
      const q = r / newR;
      [t, newT] = [newT, t - q * newT];
      [r, newR] = [newR, r - q * newR];
    }
    return t < 0n ? t + m : t;
  }
  function ptAdd(p1, p2) {
    if (!p1) return p2;
    if (!p2) return p1;
    const [x1, y1] = p1, [x2, y2] = p2;
    let lam;
    if (x1 === x2) {
      if (mod(y1 + y2, P) === 0n) return null;
      lam = mod((3n * x1 * x1 + A) * modInv(2n * y1, P), P);
    } else {
      lam = mod((y2 - y1) * modInv(x2 - x1, P), P);
    }
    const x3 = mod(lam * lam - x1 - x2, P);
    const y3 = mod(lam * (x1 - x3) - y1, P);
    return [x3, y3];
  }
  function scalarMul(k, pt) {
    if (k % N === 0n || !pt) return null;
    let res = null, add = pt, kk = k;
    while (kk > 0n) {
      if (kk & 1n) res = ptAdd(res, add);
      add = ptAdd(add, add);
      kk >>= 1n;
    }
    return res;
  }

  function hexToBytes(hex) {
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.slice(i*2, i*2+2), 16);
    return out;
  }
  function bytesToHex(b) {
    return Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  }
  function bytesToBigInt(b) { return BigInt("0x" + (bytesToHex(b) || "0")); }
  function bigIntToBytes32(n) { return hexToBytes(n.toString(16).padStart(64, "0")); }

  function rfc6979K(privBig, digestBytes) {
    const xBytes = bigIntToBytes32(privBig);
    const h1Bytes = bigIntToBytes32(bytesToBigInt(digestBytes) % N);
    let v = new Uint8Array(32).fill(1);
    let k = new Uint8Array(32).fill(0);
    k = hmacSha256(k, concat(v, new Uint8Array([0]), xBytes, h1Bytes));
    v = hmacSha256(k, v);
    k = hmacSha256(k, concat(v, new Uint8Array([1]), xBytes, h1Bytes));
    v = hmacSha256(k, v);
    while (true) {
      v = hmacSha256(k, v);
      const cand = bytesToBigInt(v);
      if (cand >= 1n && cand < N) return cand;
      k = hmacSha256(k, concat(v, new Uint8Array([0])));
      v = hmacSha256(k, v);
    }
  }

  function derivePubBytes(privBig) {
    const pt = scalarMul(privBig, G);
    return concat(new Uint8Array([4]), bigIntToBytes32(pt[0]), bigIntToBytes32(pt[1]));
  }

  function ecdsaSign(privBig, msgBytes) {
    const digest = sha256(msgBytes);
    const z = bytesToBigInt(digest);
    const k = rfc6979K(privBig, digest);
    const pt = scalarMul(k, G);
    const r = pt[0] % N;
    let s = mod(modInv(k, N) * (z + r * privBig), N);
    if (s > N / 2n) s = N - s;
    return [r, s];
  }

  function ecdsaVerify(pubBytes, msgBytes, r, s) {
    if (pubBytes.length !== 65 || pubBytes[0] !== 4) return false;
    const q = [bytesToBigInt(pubBytes.slice(1, 33)), bytesToBigInt(pubBytes.slice(33, 65))];
    if (r < 1n || r >= N || s < 1n || s >= N) return false;
    const z = bytesToBigInt(sha256(msgBytes));
    const w = modInv(s, N);
    const pt = ptAdd(scalarMul(mod(z * w, N), G), scalarMul(mod(r * w, N), q));
    return !!pt && (pt[0] % N) === r;
  }

  const B64A = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  function b64UrlEncode(bytes) {
    let out = "";
    for (let i = 0; i < bytes.length; i += 3) {
      const b0 = bytes[i], b1 = i+1 < bytes.length ? bytes[i+1] : -1, b2 = i+2 < bytes.length ? bytes[i+2] : -1;
      out += B64A[b0 >> 2];
      out += B64A[((b0 & 3) << 4) | (b1 >= 0 ? (b1 >> 4) : 0)];
      if (b1 >= 0) out += B64A[((b1 & 15) << 2) | (b2 >= 0 ? (b2 >> 6) : 0)];
      if (b2 >= 0) out += B64A[b2 & 63];
    }
    return out;
  }
  function b64UrlDecode(str) {
    const s = str.replace(/=+$/g, "").replace(/\+/g, "-").replace(/\//g, "_");
    const out = new Uint8Array(Math.floor((s.length * 3) / 4));
    let p = 0;
    for (let i = 0; i < s.length; i += 4) {
      const c0 = B64A.indexOf(s[i]), c1 = B64A.indexOf(s[i+1]);
      const c2 = i+2 < s.length ? B64A.indexOf(s[i+2]) : -2;
      const c3 = i+3 < s.length ? B64A.indexOf(s[i+3]) : -2;
      if (c0 < 0 || c1 < 0 || c2 === -1 || c3 === -1) return null;
      const t = (c0 << 18) | (c1 << 12) | ((c2 >= 0 ? c2 : 0) << 6) | (c3 >= 0 ? c3 : 0);
      if (p < out.length) out[p++] = (t >> 16) & 255;
      if (c2 >= 0 && p < out.length) out[p++] = (t >> 8) & 255;
      if (c3 >= 0 && p < out.length) out[p++] = t & 255;
    }
    return out;
  }

  function randomBytes(n) {
    const b = new Uint8Array(n);
    if (typeof crypto !== "undefined" && crypto.getRandomValues) crypto.getRandomValues(b);
    else for (let i = 0; i < n; i++) b[i] = Math.floor(Math.random() * 256);
    return b;
  }

  function keystream(encKey, nonce, len) {
    const out = new Uint8Array(len);
    let off = 0, ctr = 0;
    while (off < len) {
      const cb = new Uint8Array(4);
      new DataView(cb.buffer).setUint32(0, ctr++, false);
      const blk = sha256(concat(encKey, nonce, cb));
      const take = Math.min(32, len - off);
      out.set(blk.slice(0, take), off);
      off += take;
    }
    return out;
  }

  function encryptVault(privBig, pubBytes, password, iters = 100000) {
    const salt = randomBytes(16), nonce = randomBytes(16);
    const derived = pbkdf2Sha256(new TextEncoder().encode(password), salt, iters, 64);
    const encKey = derived.slice(0, 32), macKey = derived.slice(32, 64);
    const pt = bigIntToBytes32(privBig);
    const ks = keystream(encKey, nonce, 32);
    const ct = new Uint8Array(32);
    for (let i = 0; i < 32; i++) ct[i] = pt[i] ^ ks[i];
    const mac = hmacSha256(macKey, concat(new TextEncoder().encode("MARCO-VAULT-V1:"), salt, nonce, ct));
    return {
      format: "marco-ai-vault-v1", kdf: "pbkdf2-hmac-sha256", iterations: iters,
      salt_hex: bytesToHex(salt), nonce_hex: bytesToHex(nonce),
      ciphertext_hex: bytesToHex(ct), mac_hex: bytesToHex(mac),
      pub_uncompressed_hex: bytesToHex(pubBytes)
    };
  }

  function decryptVault(vault, password) {
    if (!vault || vault.format !== "marco-ai-vault-v1") throw new Error("无效密钥库格式");
    const salt = hexToBytes(vault.salt_hex), nonce = hexToBytes(vault.nonce_hex);
    const ct = hexToBytes(vault.ciphertext_hex), expMac = hexToBytes(vault.mac_hex);
    const iters = Number(vault.iterations || 100000);
    const derived = pbkdf2Sha256(new TextEncoder().encode(password), salt, iters, 64);
    const encKey = derived.slice(0, 32), macKey = derived.slice(32, 64);
    const actMac = hmacSha256(macKey, concat(new TextEncoder().encode("MARCO-VAULT-V1:"), salt, nonce, ct));
    let diff = 0;
    for (let i = 0; i < 32; i++) diff |= actMac[i] ^ expMac[i];
    if (diff !== 0) throw new Error("主密码错误或密钥库已损坏");
    const ks = keystream(encKey, nonce, ct.length);
    const pt = new Uint8Array(ct.length);
    for (let i = 0; i < ct.length; i++) pt[i] = ct[i] ^ ks[i];
    const privBig = bytesToBigInt(pt);
    const pubBytes = hexToBytes(vault.pub_uncompressed_hex);
    if (bytesToHex(derivePubBytes(privBig)) !== vault.pub_uncompressed_hex.toLowerCase()) {
      throw new Error("公钥一致性校验失败");
    }
    return { privBig, pubBytes };
  }

  function platformLabel(flags) {
    const m = flags & 0x70;
    if (m === 0 || m === 0x70) return "三端通用 (Android/iOS/Windows)";
    const list = [];
    if (m & 0x10) list.push("Android");
    if (m & 0x20) list.push("iOS");
    if (m & 0x40) list.push("Windows");
    return "仅限 " + list.join("/");
  }

  function encodePasscode(privBig, { batchId, expireDay, flags, minVersionCode = 0, nonce = null }) {
    const actualNonce = nonce === null ? ((randomBytes(2)[0] << 8) | randomBytes(2)[1]) : (nonce & 0xffff);
    const payload = new Uint8Array(10);
    const dv = new DataView(payload.buffer);
    dv.setUint8(0, 1);
    dv.setUint8(1, flags & 0xff);
    dv.setUint16(2, batchId & 0xffff, false);
    dv.setUint16(4, expireDay & 0xffff, false);
    dv.setUint16(6, minVersionCode & 0xffff, false);
    dv.setUint16(8, actualNonce & 0xffff, false);
    const [r, s] = ecdsaSign(privBig, concat(DOMAIN_SEP, payload));
    return TOKEN_PREFIX + b64UrlEncode(concat(payload, bigIntToBytes32(r), bigIntToBytes32(s)));
  }

  function verifyPasscode(code, pubHex = DEFAULT_PUB_HEX) {
    const cleaned = (code || "").replace(/\s+/g, "");
    if (!cleaned.startsWith(TOKEN_PREFIX)) return { valid: false, error: "前缀不是 MM-AI1-" };
    const raw = b64UrlDecode(cleaned.slice(TOKEN_PREFIX.length));
    if (!raw || raw.length !== 74) return { valid: false, error: "编码或长度无效" };
    const payload = raw.slice(0, 10);
    const r = bytesToBigInt(raw.slice(10, 42)), s = bytesToBigInt(raw.slice(42, 74));
    const ok = ecdsaVerify(hexToBytes(pubHex), concat(DOMAIN_SEP, payload), r, s);
    const dv = new DataView(payload.buffer);
    const version = dv.getUint8(0), flags = dv.getUint8(1);
    const batchId = dv.getUint16(2, false), expireDay = dv.getUint16(4, false);
    const minVc = dv.getUint16(6, false), nonce = dv.getUint16(8, false);
    const expireDate = expireDay === 0 ? "永久有效" : new Date(EPOCH_2026_UTC_MS + expireDay * 86400000).toISOString().slice(0, 10);
    return {
      valid: ok, version, flags, batchId, expireDay, expireDate, minVersionCode: minVc, nonce,
      platform: platformLabel(flags),
      shared: !!(flags & 0x04),
      experimentalOAuth: !!(flags & 0x02)
    };
  }

  return {
    DEFAULT_PUB_HEX, EPOCH_2026_UTC_MS,
    hexToBytes, bytesToHex, bytesToBigInt, derivePubBytes,
    encryptVault, decryptVault, encodePasscode, verifyPasscode, platformLabel
  };
})();

if (typeof module !== "undefined" && module.exports) {
  module.exports = MarcoCrypto;
}

// --- Mobile UI Controller ---
const PRELOADED_VAULT = /*__PRELOADED_ENCRYPTED_VAULT__*/null;
const LS_VAULT = "marco_ai_encrypted_vault_v1";
const LS_LEDGER = "marco_ai_issue_ledger_v1";
const LS_BATCH = "marco_ai_last_batch_v1";

let activePrivBig = null;
let activePubHex = MarcoCrypto.DEFAULT_PUB_HEX;
let pendingRawKey = null;
let selectedPlats = new Set(["all"]);
let lastIssued = { codes: [], summary: "", plat: "", expire: "" };

function toast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._tId);
  window._tId = setTimeout(() => el.classList.remove("show"), 2200);
}

function getStoredVault() {
  try {
    const s = localStorage.getItem(LS_VAULT);
    if (s) return JSON.parse(s);
  } catch (_) {}
  return PRELOADED_VAULT;
}

function initUi() {
  if (typeof document === "undefined") return;
  const savedBatch = Number(localStorage.getItem(LS_BATCH) || "1");
  document.getElementById("batchIn").value = Math.max(1, savedBatch);
  const v = getStoredVault();
  if (v) {
    activePubHex = v.pub_uncompressed_hex || MarcoCrypto.DEFAULT_PUB_HEX;
    document.getElementById("vaultHint").textContent = "已载入加密签名密钥库，请输入主密码解锁后发码。";
  } else {
    document.getElementById("unlockPane").classList.add("hidden");
  }
  renderLedger();
}

function unlockStoredVault() {
  const v = getStoredVault();
  if (!v) return toast("请先导入密钥文件");
  const pwd = document.getElementById("unlockPwd").value;
  if (!pwd) return toast("请输入主密码");
  try {
    const res = MarcoCrypto.decryptVault(v, pwd);
    activePrivBig = res.privBig;
    activePubHex = MarcoCrypto.bytesToHex(res.pubBytes);
    document.getElementById("unlockPwd").value = "";
    syncUnlockedUi(true);
    toast("签名密钥库已解锁");
  } catch (e) {
    toast(e.message || "解锁失败");
  }
}

function lockVault() {
  activePrivBig = null;
  syncUnlockedUi(false);
  toast("已锁定密钥库");
}

function syncUnlockedUi(on) {
  const b = document.getElementById("lockBadge");
  b.textContent = on ? "已解锁 · 离线签发就绪" : "未解锁";
  b.classList.toggle("ok", on);
  document.getElementById("lockBtn").classList.toggle("hidden", !on);
  document.getElementById("unlockPane").classList.toggle("hidden", on || !getStoredVault());
  document.getElementById("importPane").classList.toggle("hidden", on);
  document.getElementById("issueCard").classList.toggle("hidden", !on);
  document.getElementById("ledgerCard").classList.toggle("hidden", !on);
}

function handleImportFile(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(String(reader.result));
      if (obj.format === "marco-ai-vault-v1") {
        localStorage.setItem(LS_VAULT, JSON.stringify(obj));
        activePubHex = obj.pub_uncompressed_hex || MarcoCrypto.DEFAULT_PUB_HEX;
        document.getElementById("unlockPane").classList.remove("hidden");
        document.getElementById("rawPwdBox").classList.add("hidden");
        toast("已导入加密密钥库，请输入主密码解锁");
      } else if (obj.format === "marco-ai-beta-p256-v1" && obj.d_hex) {
        pendingRawKey = obj;
        document.getElementById("rawPwdBox").classList.remove("hidden");
        toast("已读取私钥，请设置主密码加密保存在本机");
      } else {
        toast("不识别的密钥文件格式");
      }
    } catch (_) {
      toast("解析文件失败，请确认 JSON 文件完整");
    }
  };
  reader.readAsText(f);
}

function finishRawImport() {
  if (!pendingRawKey) return;
  const pwd = document.getElementById("newVaultPwd").value;
  if (!pwd || pwd.length < 6) return toast("主密码至少 6 位");
  try {
    const privBig = BigInt("0x" + pendingRawKey.d_hex);
    const pubBytes = MarcoCrypto.derivePubBytes(privBig);
    const vault = MarcoCrypto.encryptVault(privBig, pubBytes, pwd);
    localStorage.setItem(LS_VAULT, JSON.stringify(vault));
    pendingRawKey = null;
    document.getElementById("newVaultPwd").value = "";
    document.getElementById("rawPwdBox").classList.add("hidden");
    activePrivBig = privBig;
    activePubHex = MarcoCrypto.bytesToHex(pubBytes);
    syncUnlockedUi(true);
    toast("私钥已加密存入本机并解锁");
  } catch (e) {
    toast("加密保存失败：" + e.message);
  }
}

function pickPlat(p) {
  if (p === "all") {
    selectedPlats = new Set(["all"]);
  } else {
    selectedPlats.delete("all");
    if (selectedPlats.has(p)) selectedPlats.delete(p);
    else selectedPlats.add(p);
    if (selectedPlats.size === 0 || selectedPlats.size === 3) selectedPlats = new Set(["all"]);
  }
  document.querySelectorAll("#platPills .pill").forEach(btn => {
    btn.classList.toggle("on", selectedPlats.has(btn.dataset.p));
  });
}

function setDays(d, btn) {
  document.getElementById("daysIn").value = d;
  document.querySelectorAll("#daysPills .pill").forEach(b => b.classList.toggle("on", b === btn));
}

function issueNow() {
  if (!activePrivBig) return toast("请先解锁密钥库");
  const batchId = Math.max(1, Math.min(65535, Number(document.getElementById("batchIn").value) || 1));
  const days = Math.max(0, Number(document.getElementById("daysIn").value) || 0);
  const count = Math.max(1, Math.min(50, Number(document.getElementById("countIn").value) || 1));
  const minVc = Math.max(0, Math.min(65535, Number(document.getElementById("minVcIn").value) || 0));
  const note = (document.getElementById("noteIn").value || "").trim();
  const shared = document.getElementById("sharedChk").checked;
  const expOAuth = document.getElementById("expChk").checked;

  let flags = 0x01;
  if (expOAuth) flags |= 0x02;
  if (shared) flags |= 0x04;
  if (!selectedPlats.has("all")) {
    if (selectedPlats.has("android")) flags |= 0x10;
    if (selectedPlats.has("ios")) flags |= 0x20;
    if (selectedPlats.has("windows")) flags |= 0x40;
  }

  let expireDay = 0, expireLabel = "永久有效";
  if (days > 0) {
    const todayUtc = Math.floor((Date.now() - MarcoCrypto.EPOCH_2026_UTC_MS) / 86400000);
    expireDay = Math.max(1, todayUtc + days);
    expireLabel = new Date(MarcoCrypto.EPOCH_2026_UTC_MS + expireDay * 86400000).toISOString().slice(0, 10);
  }

  const codes = [];
  for (let i = 0; i < count; i++) {
    const c = MarcoCrypto.encodePasscode(activePrivBig, { batchId, expireDay, flags, minVersionCode: minVc });
    const chk = MarcoCrypto.verifyPasscode(c, activePubHex);
    if (!chk.valid) return toast("内部自检失败");
    codes.push(c);
  }

  const plat = MarcoCrypto.platformLabel(flags);
  const summary = `批次 #${String(batchId).padStart(4,"0")} · ${plat} · ${shared ? "频道通用" : "专属独立"} · 有效至 ${expireLabel}`;
  lastIssued = { codes, summary, plat, expire: expireLabel };

  document.getElementById("resultMeta").textContent = summary;
  document.getElementById("resultCodes").textContent = codes.join("\n");
  document.getElementById("resultWrap").classList.remove("hidden");

  localStorage.setItem(LS_BATCH, String(batchId + 1));
  document.getElementById("batchIn").value = batchId + 1;

  const ledger = loadLedger();
  ledger.unshift({
    at: new Date().toLocaleString("zh-CN", { hour12: false }),
    batchId, plat, shared, expOAuth, expireLabel, count, note, codes
  });
  localStorage.setItem(LS_LEDGER, JSON.stringify(ledger.slice(0, 100)));
  renderLedger();
  toast(`已签发 ${count} 枚口令`);
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("已复制到剪贴板")).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  toast("已复制到剪贴板");
}

function copyLastCodes(withCaption) {
  if (!lastIssued.codes.length) return;
  const raw = lastIssued.codes.join("\n");
  if (!withCaption) return copyText(raw);
  const msg = `【Marco Movie · AI 观影实验室测试口令】\n${lastIssued.summary}\n复制下方口令前往「设置 → 网盘、追剧与 AI 助手 → AI 观影实验室」粘贴开启：\n${raw}`;
  copyText(msg);
}

function verifyInputCode() {
  const val = document.getElementById("verifyIn").value;
  const res = MarcoCrypto.verifyPasscode(val, activePubHex);
  const out = document.getElementById("verifyOut");
  out.textContent = JSON.stringify(res, null, 2);
  out.classList.remove("hidden");
  toast(res.valid ? "签名验证通过" : ("验证失败：" + (res.error || "签名无效")));
}

function loadLedger() {
  try { return JSON.parse(localStorage.getItem(LS_LEDGER) || "[]"); } catch (_) { return []; }
}

function renderLedger() {
  const box = document.getElementById("ledgerList");
  if (!box) return;
  const list = loadLedger();
  if (!list.length) {
    box.innerHTML = '<p class="hint">暂无发码记录。</p>';
    return;
  }
  box.innerHTML = list.map((it, idx) => `
    <div class="item">
      <div class="item-top">
        <span>#${String(it.batchId).padStart(4,"0")} · ${it.note || (it.shared ? "频道通用" : "专属测试")} (${it.count}枚)</span>
        <button class="btn sm sec" onclick="copyLedger(${idx})">复制</button>
      </div>
      <div class="item-meta">${it.plat} · 有效至 ${it.expireLabel} · ${it.at}</div>
    </div>`).join("");
}

function copyLedger(idx) {
  const it = loadLedger()[idx];
  if (it && it.codes) copyText(it.codes.join("\n"));
}

function exportLedger() {
  const blob = new Blob([JSON.stringify(loadLedger(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "marco-ai-passcode-ledger.json";
  a.click();
}

if (typeof window !== "undefined") window.addEventListener("DOMContentLoaded", initUi);
</script>
</body>
