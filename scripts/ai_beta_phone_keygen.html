<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Marco Movie · 三端统一离线发码器 (Ed25519)</title>
<style>
:root{--bg:#0a0b0e;--card:#15171e;--sub:#20232d;--fg:#f3f5f9;--muted:#949ba8;--accent:#007aff;--ok:#10b981;--warn:#f59e0b;--danger:#ff453a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:max(16px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--fg);line-height:1.45}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:19px;margin:0;letter-spacing:.2px}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,122,255,.18);color:#58a6ff}
.badge.ok{background:rgba(16,185,129,.18);color:#34d399}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.hint{font-size:12px;color:var(--muted);margin:0 0 10px}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600}
input,textarea{width:100%;background:var(--sub);color:var(--fg);border:none;border-radius:12px;padding:11px 12px;font-size:14px;outline:none}
textarea{resize:vertical;min-height:74px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pill{padding:7px 12px;border-radius:999px;background:var(--sub);color:var(--muted);font-size:12.5px;font-weight:600;border:none;cursor:pointer}
.pill.on{background:rgba(0,122,255,.22);color:#60a5fa}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:12px 14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.sec{background:var(--sub);color:var(--fg)}
.btn.sm{width:auto;padding:7px 12px;font-size:12px;border-radius:10px}
.code-box{background:#0e1016;border-radius:12px;padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;margin:8px 0;color:#d8e7ff}
.item{background:var(--sub);border-radius:12px;padding:11px 12px;margin-top:8px}
.item-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.item-meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
.hidden{display:none!important}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Marco 离线发码器</h1>
    <span id="lockBadge" class="badge">未解锁</span>
  </header>

  <section id="vaultCard" class="card">
    <h2>Ed25519 签名密钥库 <button id="lockBtn" class="btn sm sec hidden" onclick="lockVault()">锁定</button></h2>
    <p id="vaultHint" class="hint">纯离线运行（零联网）。签发 MMAILAB1 统一口令：Android 移动端 · iOS · Windows 三端共用同一把 Ed25519 密钥。</p>

    <div id="unlockPane">
      <label class="lbl">输入主密码解锁</label>
      <div class="row">
        <input id="unlockPwd" type="password" autocomplete="current-password" placeholder="输入主密码">
        <button class="btn" style="flex:0 0 96px" onclick="unlockStoredVault()">解锁</button>
      </div>
    </div>

    <div id="importPane" style="margin-top:12px">
      <label class="lbl">首次导入密钥（支持 ai_lab_mobile_vault.json 或原始 64 位 hex 私钥 ai-lab-ed25519.key）</label>
      <input id="vaultFile" type="file" accept=".json,.key,.txt,application/json,text/plain" onchange="handleImportFile(event)">
      <div id="rawPwdBox" class="hidden" style="margin-top:8px">
        <label class="lbl">为导入的 Ed25519 私钥设置本机加密主密码（至少 6 位）</label>
        <div class="row">
          <input id="newVaultPwd" type="password" placeholder="设置主密码">
          <button class="btn" style="flex:0 0 108px" onclick="finishRawImport()">加密保存</button>
        </div>
      </div>
    </div>
  </section>

  <section id="issueCard" class="card hidden">
    <h2>签发统一内测口令 (MMAILAB1)</h2>
    <label class="lbl">适用平台（全选或留空 = 三端通用）</label>
    <div class="pills" id="platPills">
      <button type="button" class="pill on" data-p="all" onclick="pickPlat('all')">三端通用</button>
      <button type="button" class="pill" data-p="android" onclick="pickPlat('android')">Android</button>
      <button type="button" class="pill" data-p="ios" onclick="pickPlat('ios')">iOS</button>
      <button type="button" class="pill" data-p="windows" onclick="pickPlat('windows')">Windows</button>
    </div>

    <label class="lbl">有效期</label>
    <div class="pills" id="daysPills">
      <button type="button" class="pill" onclick="setDays(7,this)">7 天</button>
      <button type="button" class="pill on" onclick="setDays(30,this)">30 天</button>
      <button type="button" class="pill" onclick="setDays(90,this)">90 天</button>
      <button type="button" class="pill" onclick="setDays(0,this)">永久有效</button>
    </div>

    <div class="row" style="margin-top:8px">
      <div>
        <label class="lbl">标签 / 批次 Tag</label>
        <input id="tagIn" type="text" value="channel-01" placeholder="如：channel-01">
      </div>
      <div>
        <label class="lbl">有效天数（0=永久）</label>
        <input id="daysIn" type="number" min="0" max="60000" value="30">
      </div>
      <div>
        <label class="lbl">生成数量</label>
        <input id="countIn" type="number" min="1" max="50" value="1">
      </div>
    </div>

    <div class="row" style="margin-top:4px">
      <div>
        <label class="lbl">最低版本码（三端通用填 0）</label>
        <input id="minVcIn" type="number" min="0" max="65535" value="0">
      </div>
      <div>
        <label class="lbl">发放备注（仅存本机台账）</label>
        <input id="noteIn" type="text" placeholder="如：腾讯频道第一批">
      </div>
    </div>

    <div class="sw">
      <span>频道通用口令（多人共用体验）</span>
      <input id="sharedChk" type="checkbox" checked>
    </div>
    <div class="sw">
      <span>开放实验性 OpenAI OAuth 权限</span>
      <input id="expChk" type="checkbox">
    </div>

    <button class="btn" style="margin-top:8px" onclick="issueNow()">立即离线签发口令</button>

    <div id="resultWrap" class="hidden" style="margin-top:12px">
      <div id="resultMeta" class="hint"></div>
      <div id="resultCodes" class="code-box"></div>
      <div class="row">
        <button class="btn" onclick="copyLastCodes(false)">一键复制口令</button>
        <button class="btn sec" onclick="copyLastCodes(true)">复制带频道说明文案</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>离线验签与口令解析</h2>
    <textarea id="verifyIn" placeholder="粘贴 MMAILAB1.… 口令离线检验 Ed25519 真伪、适用平台与有效期"></textarea>
    <button class="btn sec" style="margin-top:8px" onclick="verifyInputCode()">立即离线验证</button>
    <div id="verifyOut" class="code-box hidden"></div>
  </section>

  <section id="ledgerCard" class="card hidden">
    <h2>本机发码台账 <button class="btn sm sec" onclick="exportLedger()">导出备份</button></h2>
    <div id="ledgerList"></div>
  </section>
</div>
<div id="toast" class="toast"></div>

      if (b2 >= 0) out += B64A[b2 & 63];

  }
  function b64UrlDecode(str) {
    const s = str.replace(/=+$/g, "").replace(/\+/g, "-").replace(/\//g, "_");
    const out = new Uint8Array(Math.floor((s.length * 3) / 4));

    for (let i = 0; i < s.length; i += 4) {
      const c0 = B64A.indexOf(s[i]), c1 = B64A.indexOf(s[i+1]);
      const c2 = i+2 < s.length ? B64A.indexOf(s[i+2]) : -2;
      const c3 = i+3 < s.length ? B64A.indexOf(s[i+3]) : -2;

  function decryptVault(vault, password) {

// --- Mobile UI Controller ---
const PRELOADED_VAULT = /*__PRELOADED_ENCRYPTED_VAULT__*/null;
const LS_VAULT = "marco_ai_ed25519_vault_v1";
const LS_LEDGER = "marco_ai_ed25519_ledger_v1";
let activeSeed = null;
let activePubHex = MarcoEd25519.DEFAULT_PUB_HEX;
let pendingRawSeed = null;
let selectedPlats = new Set(["all"]);
let lastIssued = { codes: [], summary: "" };

function toast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg; el.classList.add("show");
  clearTimeout(window._tId); window._tId = setTimeout(() => el.classList.remove("show"), 2200);
}
function getStoredVault() {
  try { const s = localStorage.getItem(LS_VAULT); if (s) return JSON.parse(s); } catch (_) {}
  return PRELOADED_VAULT;
}
function initUi() {
  if (typeof document === "undefined") return;
  const v = getStoredVault();
  if (v) {
    activePubHex = v.pub_hex || MarcoEd25519.DEFAULT_PUB_HEX;
    document.getElementById("vaultHint").textContent = "已载入加密 Ed25519 签名密钥库，输入主密码解锁即可签发三端通用 MMAILAB1 口令。";
  } else {
    document.getElementById("unlockPane").classList.add("hidden");
  }
  renderLedger();
}
function unlockStoredVault() {
  const v = getStoredVault();
  if (!v) return toast("请先导入密钥文件");
  const pwd = document.getElementById("unlockPwd").value;
  if (!pwd) return toast("请输入主密码");
  try {
    const res = MarcoEd25519.decryptVault(v, pwd);
    activeSeed = res.seed; activePubHex = MarcoEd25519.bytesToHex(res.pub);
    document.getElementById("unlockPwd").value = "";
    syncUnlockedUi(true); toast("Ed25519 密钥库已解锁");
  } catch (e) { toast(e.message || "解锁失败"); }
}
function lockVault() { activeSeed = null; syncUnlockedUi(false); toast("已锁定密钥库"); }
function syncUnlockedUi(on) {
  const b = document.getElementById("lockBadge");
  b.textContent = on ? "已解锁 · 三端离线签发就绪" : "未解锁";
  b.classList.toggle("ok", on);
  document.getElementById("lockBtn").classList.toggle("hidden", !on);
  document.getElementById("unlockPane").classList.toggle("hidden", on || !getStoredVault());
  document.getElementById("importPane").classList.toggle("hidden", on);
  document.getElementById("issueCard").classList.toggle("hidden", !on);
  document.getElementById("ledgerCard").classList.toggle("hidden", !on);
}
function handleImportFile(ev) {
  const f = ev.target.files && ev.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || "").trim();
    try {
      const obj = JSON.parse(text);
      if (obj.format === "marco-ai-ed25519-vault-v1") {
        localStorage.setItem(LS_VAULT, JSON.stringify(obj));
        activePubHex = obj.pub_hex || MarcoEd25519.DEFAULT_PUB_HEX;
        document.getElementById("unlockPane").classList.remove("hidden");
        document.getElementById("rawPwdBox").classList.add("hidden");
        return toast("已导入加密密钥库，请输入主密码解锁");
      }
    } catch (_) {}
    const hex = text.split(/\r?\n/).filter(l => l.trim() && !l.trim().startsWith("#")).join("").trim();
    if (/^[0-9a-fA-F]{64}$/.test(hex)) {
      pendingRawSeed = MarcoEd25519.hexToBytes(hex);
      document.getElementById("rawPwdBox").classList.remove("hidden");
      return toast("已读取 32 字节 Ed25519 私钥，请设置本机加密主密码");
    }
    toast("无法识别的密钥文件格式");
  };
  reader.readAsText(f);
}
function finishRawImport() {
  if (!pendingRawSeed) return;
  const pwd = document.getElementById("newVaultPwd").value;
  if (!pwd || pwd.length < 6) return toast("主密码至少 6 位");
  const pub = MarcoEd25519.publicKeyFromSeed(pendingRawSeed);
  const vault = MarcoEd25519.encryptVault(pendingRawSeed, pub, pwd);
  localStorage.setItem(LS_VAULT, JSON.stringify(vault));
  activeSeed = pendingRawSeed; activePubHex = MarcoEd25519.bytesToHex(pub);
  pendingRawSeed = null; document.getElementById("newVaultPwd").value = "";
  document.getElementById("rawPwdBox").classList.add("hidden");
  syncUnlockedUi(true); toast("私钥已加密存入本机并解锁");
}
function pickPlat(p) {
  if (p === "all") selectedPlats = new Set(["all"]);
  else {
    selectedPlats.delete("all");
    if (selectedPlats.has(p)) selectedPlats.delete(p); else selectedPlats.add(p);
    if (selectedPlats.size === 0 || selectedPlats.size === 3) selectedPlats = new Set(["all"]);
  }
  document.querySelectorAll("#platPills .pill").forEach(b => b.classList.toggle("on", selectedPlats.has(b.dataset.p)));
}
function setDays(d, btn) {
  document.getElementById("daysIn").value = d;
  document.querySelectorAll("#daysPills .pill").forEach(b => b.classList.toggle("on", b === btn));
}
function issueNow() {
  if (!activeSeed) return toast("请先解锁密钥库");
  const tag = (document.getElementById("tagIn").value || "channel-01").trim();
  const days = Math.max(0, Number(document.getElementById("daysIn").value) || 0);
  const count = Math.max(1, Math.min(50, Number(document.getElementById("countIn").value) || 1));
  const minVc = Math.max(0, Math.min(65535, Number(document.getElementById("minVcIn").value) || 0));
  const note = (document.getElementById("noteIn").value || "").trim();
  const shared = document.getElementById("sharedChk").checked;
  const expOAuth = document.getElementById("expChk").checked;
  const plat = selectedPlats.has("all") ? "all" : Array.from(selectedPlats).join(",");
  const codes = [];
  let expireLabel = "永久有效";
  for (let i = 0; i < count; i++) {
    const c = MarcoEd25519.encodePasscode(activeSeed, { tag, days, plat, shared, expOAuth, minVc });
    const chk = MarcoEd25519.verifyPasscode(c, activePubHex);
    if (!chk.valid) return toast("签名自检失败");
    expireLabel = chk.expireDate;
    codes.push(c);
  }
  const platZh = plat === "all" ? "三端通用 (Android/iOS/Windows)" : ("仅限 " + plat);
  const summary = `${tag} · ${platZh} · ${shared ? "频道通用" : "专属测试"} · 有效至 ${expireLabel}`;
  lastIssued = { codes, summary };
  document.getElementById("resultMeta").textContent = summary;
  document.getElementById("resultCodes").textContent = codes.join("\n");
  document.getElementById("resultWrap").classList.remove("hidden");
  const ledger = loadLedger();
  ledger.unshift({ at: new Date().toLocaleString("zh-CN", { hour12: false }), tag, plat: platZh, shared, expireLabel, count, note, codes });
  localStorage.setItem(LS_LEDGER, JSON.stringify(ledger.slice(0, 100)));
  renderLedger(); toast(`已签发 ${count} 枚 MMAILAB1 口令`);
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast("已复制到剪贴板")).catch(()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
  document.execCommand("copy"); document.body.removeChild(ta); toast("已复制到剪贴板");
}
function copyLastCodes(withCaption) {
  if (!lastIssued.codes.length) return;
  const raw = lastIssued.codes.join("\n");
  if (!withCaption) return copyText(raw);
  copyText(`【Marco Movie · AI 观影实验室测试口令】\n${lastIssued.summary}\n复制下方口令前往设置「AI 观影实验室」粘贴解锁：\n${raw}`);
}
function verifyInputCode() {
  const res = MarcoEd25519.verifyPasscode(document.getElementById("verifyIn").value, activePubHex);
  const out = document.getElementById("verifyOut");
  out.textContent = JSON.stringify(res, null, 2); out.classList.remove("hidden");
  toast(res.valid ? "Ed25519 签名验证通过" : ("验证失败：" + (res.error || "签名无效")));
}
function loadLedger() { try { return JSON.parse(localStorage.getItem(LS_LEDGER) || "[]"); } catch (_) { return []; } }
function renderLedger() {
  const box = document.getElementById("ledgerList"); if (!box) return;
  const list = loadLedger();
  if (!list.length) { box.innerHTML = '<p class="hint">暂无发码记录。</p>'; return; }
  box.innerHTML = list.map((it, idx) => `<div class="item"><div class="item-top"><span>${it.tag} · ${it.note || (it.shared ? "频道通用" : "专属测试")} (${it.count}枚)</span><button class="btn sm sec" onclick="copyLedger(${idx})">复制</button></div><div class="item-meta">${it.plat} · 有效至 ${it.expireLabel} · ${it.at}</div></div>`).join("");
}
function copyLedger(idx) { const it = loadLedger()[idx]; if (it && it.codes) copyText(it.codes.join("\n")); }
function exportLedger() {
  const blob = new Blob([JSON.stringify(loadLedger(), null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "marco-ai-passcode-ledger.json"; a.click();
}
if (typeof window !== "undefined") window.addEventListener("DOMContentLoaded", initUi);
</script>
